services:
  - type: web
    name: garima-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: garima
      - key: CORS_ORIGINS
        sync: false
